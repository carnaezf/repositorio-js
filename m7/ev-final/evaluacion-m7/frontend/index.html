<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Administración de países</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="/app/css/styles.css"
  >
</head>

<body>
  <header class="bg-dark text-white py-4">
    <div class="container">
      <h1 class="h2 mb-1">
        Administración de países
      </h1>

      <p class="mb-0">
        Node.js, Express, PostgreSQL y Sequelize
      </p>
    </div>
  </header>

  <main class="container py-5">
    <div
      id="mensaje"
      class="alert d-none"
      role="alert"
    ></div>

    <section class="card shadow-sm mb-4">
      <div class="card-body">
        <div
          class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-3"
        >
          <div>
            <h2 class="h4 mb-1">
              Lista de países
            </h2>

            <p class="text-secondary mb-0">
              Seleccione la cantidad de registros por bloque.
            </p>
          </div>

          <div>
            <label
              for="limite"
              class="form-label"
            >
              Registros
            </label>

            <select
              id="limite"
              class="form-select"
            >
              <option value="5">5</option>
              <option value="10">10</option>
              <option value="20">20</option>
            </select>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-striped table-hover">
            <thead>
              <tr>
                <th>País</th>
                <th>Continente</th>
                <th>Población</th>
                <th>PIB 2019</th>
                <th>PIB 2020</th>
              </tr>
            </thead>

            <tbody id="tabla-paises"></tbody>
          </table>
        </div>

        <div class="d-flex gap-2">
          <button
            id="btn-reiniciar"
            class="btn btn-secondary"
            type="button"
          >
            Volver al inicio
          </button>

          <button
            id="btn-siguiente"
            class="btn btn-primary"
            type="button"
          >
            Siguiente
          </button>
        </div>
      </div>
    </section>

    <div class="row g-4">
      <div class="col-lg-8">
        <section class="card shadow-sm h-100">
          <div class="card-body">
            <h2 class="h4">
              Agregar país
            </h2>

            <form id="form-agregar">
              <div class="row g-3">
                <div class="col-md-6">
                  <label
                    for="nombre"
                    class="form-label"
                  >
                    Nombre
                  </label>

                  <input
                    id="nombre"
                    name="nombre"
                    class="form-control"
                    required
                  >
                </div>

                <div class="col-md-6">
                  <label
                    for="continente"
                    class="form-label"
                  >
                    Continente
                  </label>

                  <input
                    id="continente"
                    name="continente"
                    class="form-control"
                    required
                  >
                </div>

                <div class="col-md-4">
                  <label
                    for="poblacion"
                    class="form-label"
                  >
                    Población
                  </label>

                  <input
                    id="poblacion"
                    name="poblacion"
                    type="number"
                    min="0"
                    class="form-control"
                    required
                  >
                </div>

                <div class="col-md-4">
                  <label
                    for="pib2019"
                    class="form-label"
                  >
                    PIB 2019
                  </label>

                  <input
                    id="pib2019"
                    name="pib2019"
                    type="number"
                    min="0"
                    step="0.01"
                    class="form-control"
                    required
                  >
                </div>

                <div class="col-md-4">
                  <label
                    for="pib2020"
                    class="form-label"
                  >
                    PIB 2020
                  </label>

                  <input
                    id="pib2020"
                    name="pib2020"
                    type="number"
                    min="0"
                    step="0.01"
                    class="form-control"
                    required
                  >
                </div>

                <div class="col-12">
                  <button
                    class="btn btn-success"
                    type="submit"
                  >
                    Agregar país
                  </button>
                </div>
              </div>
            </form>
          </div>
        </section>
      </div>

      <div class="col-lg-4">
        <section class="card shadow-sm h-100">
          <div class="card-body">
            <h2 class="h4">
              Eliminar país
            </h2>

            <form id="form-eliminar">
              <div class="mb-3">
                <label
                  for="nombre-eliminar"
                  class="form-label"
                >
                  Nombre
                </label>

                <input
                  id="nombre-eliminar"
                  name="nombre"
                  class="form-control"
                  required
                >
              </div>

              <button
                class="btn btn-danger"
                type="submit"
              >
                Eliminar país
              </button>
            </form>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script
    type="module"
    src="/app/js/main.js"
  ></script>
</body>

</html>
