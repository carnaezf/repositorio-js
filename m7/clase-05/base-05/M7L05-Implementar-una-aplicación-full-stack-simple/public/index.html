<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Gestión de clientes</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/css/styles.css" />
  </head>

  <body>
    <main class="container py-5">
      <header class="mb-4">
        <h1>Gestión de clientes</h1>

        <p class="text-secondary">
          Aplicación con Express, Sequelize, PostgreSQL
          y Fetch API.
        </p>
      </header>

      <div
        id="mensaje"
        class="alert d-none"
        role="alert"
      ></div>

      <section class="card shadow-sm mb-4">
        <div class="card-body">
          <h2 class="h4 mb-3">
            Registrar cliente
          </h2>

          <form id="form-cliente">
            <div class="mb-3">
              <label
                for="nombre"
                class="form-label"
              >
                Nombre
              </label>

              <input
                id="nombre"
                name="nombre"
                class="form-control"
                type="text"
                maxlength="100"
                required
              />
            </div>

            <div class="mb-3">
              <label
                for="email"
                class="form-label"
              >
                Correo electrónico
              </label>

              <input
                id="email"
                name="email"
                class="form-control"
                type="email"
                maxlength="120"
                required
              />
            </div>

            <button
              id="btn-agregar"
              class="btn btn-primary"
              type="submit"
            >
              Agregar cliente
            </button>
          </form>
        </div>
      </section>

      <section class="card shadow-sm">
        <div class="card-body">
          <div
            class="d-flex flex-column flex-sm-row justify-content-between gap-3 mb-3"
          >
            <div>
              <h2 class="h4 mb-1">
                Clientes registrados
              </h2>

              <p
                id="total-clientes"
                class="text-secondary mb-0"
              >
                Total: 0
              </p>
            </div>

            <button
              id="btn-listar"
              class="btn btn-outline-primary"
              type="button"
            >
              Obtener clientes
            </button>
          </div>

          <div
            id="estado-carga"
            class="text-secondary"
          >
            Presione “Obtener clientes” para consultar
            la API.
          </div>

          <ul
            id="lista-clientes"
            class="list-group mt-3"
          ></ul>
        </div>
      </section>
    </main>

    <script src="/js/app.js"></script>
  </body>
</html>
